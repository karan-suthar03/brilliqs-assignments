[project]
name = "assignment1"
version = "0.1.0"
description = "Event-driven S3 to Lambda CSV processor"
requires-python = ">=3.13"

# For the operator scripts and the deploy tooling. The Lambda package itself
# is processor/, which ships no dependencies at all.
dependencies = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

