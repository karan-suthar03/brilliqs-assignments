[project]
name = "csv-processor"
version = "0.1.0"
description = "S3 event-driven Lambda that converts uploaded CSV files to JSON Lines"
requires-python = ">=3.13"

# Empty on purpose - the Lambda runtime already provides boto3.
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.35",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
